<!doctype html>
<!-- 指定中文语言以改善读屏器和浏览器的中文排版行为。 -->
<html lang="zh-CN">
  <!-- 文档头只存放页面元信息，不在浏览器中保存第三方密钥。 -->
  <head>
    <!-- 使用 UTF-8 正确显示中文界面与执行说明。 -->
    <meta charset="UTF-8" />
    <!-- 移动端按设备宽度渲染，并保留浏览器默认缩放能力。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 浏览器主题色与应用的森林绿保持一致。 -->
    <meta name="theme-color" content="#173c34" />
    <!-- 页面描述明确产品定位。 -->
    <meta name="description" content="行也 · 智能旅行规划工作台，比较不同出行方式，查看每一步执行依据。" />
    <!-- 设置浏览器标签名称。 -->
    <title>行也 — 旅行规划工作台</title>
  <!-- 结束文档头。 -->
  </head>
  <!-- 页面主体只提供 Vue 挂载入口。 -->
  <body>
    <!-- Vue 应用在此接管界面。 -->
    <div id="app"></div>
    <!-- Vite 从 TypeScript 入口开始编译应用。 -->
    <script type="module" src="/src/main.ts"></script>
  <!-- 结束页面主体。 -->
  </body>
<!-- 结束 HTML 文档。 -->
</html>
